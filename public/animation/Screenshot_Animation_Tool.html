<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Screenshot Animation Tool</title>

<style>
  body {
    background: #ffffff;
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 40px;
    color: #111827;
  }

  .container {
    max-width: 1100px;
    margin: auto;
  }

  h1 {
    font-size: 20px;
    margin-bottom: 12px;
  }

  .form {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    margin-bottom: 20px;
    align-items: end;
  }

  label {
    font-size: 12px;
    color: #374151;
  }

  input, button {
    padding: 6px 8px;
    font-size: 14px;
  }

  button {
    cursor: pointer;
  }

  canvas {
    max-width: 100%;
    border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    display: block;
    margin: auto;
  }

  .controls {
    margin-top: 16px;
    display: flex;
    justify-content: center;
    gap: 12px;
    align-items: center;
  }

  input[type="range"] {
    width: 260px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Screenshot Animation Tool</h1>

  <div class="form">
    <div>
      <label>Base name</label>
      <input id="base" value="investment-" />
    </div>

    <div>
      <label>Start</label>
      <input id="start" type="number" value="100000" />
    </div>

    <div>
      <label>End</label>
      <input id="end" type="number" value="800000" />
    </div>

    <div>
      <label>Step</label>
      <input id="step" type="number" value="10000" />
    </div>

    <div>
      <label>Extension</label>
      <input id="ext" value=".png" />
    </div>

    <button id="startBtn">Start animation</button>
  </div>

  <canvas id="canvas"></canvas>

  <div class="controls">
    <label>Speed</label>
    <input id="speed" type="range" min="1" max="60" value="12" />
    <span id="fpsLabel">12 FPS</span>
  </div>
</div>

<script>
/* =================================================
   CANVAS + CONTROLS
================================================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const speedSlider = document.getElementById("speed");
const fpsLabel = document.getElementById("fpsLabel");

let fps = Number(speedSlider.value);
speedSlider.addEventListener("input", () => {
  fps = Number(speedSlider.value);
  fpsLabel.textContent = `${fps} FPS`;
});

/* =================================================
   ANIMATION STATE
================================================= */
let images = [];
let index = 0;
let direction = 1;
let running = false;

/* =================================================
   BUILD + LOAD FRAMES
================================================= */
function startAnimation() {
  running = false;
  images = [];
  index = 0;
  direction = 1;

  const base = document.getElementById("base").value;
  const start = Number(document.getElementById("start").value);
  const end   = Number(document.getElementById("end").value);
  const step  = Number(document.getElementById("step").value);
  const ext   = document.getElementById("ext").value;

  const values = [];

  // Build numeric sequence (works ascending or descending)
  if (start <= end) {
    for (let v = start; v <= end; v += step) values.push(v);
  } else {
    for (let v = start; v >= end; v -= step) values.push(v);
  }

  let loaded = 0;

  values.forEach(v => {
    const img = new Image();
    img.src = `${base}${v}${ext}`;
    img.onload = () => {
      loaded++;
      if (loaded === values.length) {
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        running = true;
      }
    };
    images.push(img);
  });
}

/* =================================================
   ANIMATION LOOP
================================================= */
let lastTime = 0;

function loop(time) {
  if (running && images.length) {
    const interval = 1000 / fps;

    if (time - lastTime >= interval) {
      lastTime = time;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(images[index], 0, 0);

      index += direction;
      if (index >= images.length - 1) direction = -1;
      if (index <= 0) direction = 1;
    }
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =================================================
   START BUTTON
================================================= */
document.getElementById("startBtn")
  .addEventListener("click", startAnimation);
</script>

</body>
</html>
